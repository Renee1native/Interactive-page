
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Interactive Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div class="container">
  <h1>My Interactive Page</h1>

  <p id="message">Welcome to my interactive webpage!</p>

  <input type="text" id="favoriteInput" placeholder="Type something...">

  <ul id="favoriteList"></ul>

</body> 
<script src="script.js"></script>
</html>
